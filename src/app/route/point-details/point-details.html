@if (point) {
  <div>
    <h3>Point Details</h3>
    <p><strong>Name:</strong> {{ point.name }}</p>
    <p><strong>Odometer:</strong> {{ point.odometer ?? 0 }}</p>
    <p><strong>Distance:</strong> {{ point.distance }}</p>
      <button (click)="editPointMobile()">Edit</button>
      <button (click)="insertPointMobile()">Insert</button>
      <button (click)="deletePointMobile()">Delete</button>
  </div>
} @else {
  <p>Loading point details...</p>
}
