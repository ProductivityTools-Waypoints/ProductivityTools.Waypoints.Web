@if (point) {
  <div>
    <h3>Point Details</h3>
    <p><strong>Name:</strong> {{ point.name }}</p>
    <p><strong>Odometer:</strong> {{ point.odometer ?? 0 }}</p>
    <p><strong>Distance:</strong> {{ point.distance }}</p>
    <p><strong>Comment:</strong> {{ point.comment }}</p>
      <button (click)="editPointMobile()">Edit</button>
      <button (click)="insertPointMobile()">Insert</button>
      <button (click)="deletePointMobile()">Delete</button>
      <button (click)="onCancel()">Cancel</button>

      <!-- Reusable Delete Point Confirmation Modal -->
      @if (showDeleteConfirm) {
        <app-confirm-dialog
          [title]="'Delete Point'"
          [message]="'Are you sure you want to delete the point &quot;' + point.name + '&quot;?'"
          [confirmText]="'Delete'"
          (confirm)="confirmDelete()"
          (cancel)="cancelDelete()">
        </app-confirm-dialog>
      }
  </div>
} @else {
  <p>Loading point details...</p>
}
