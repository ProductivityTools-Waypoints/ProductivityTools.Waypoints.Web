@if (point) {
  <div class="point-editor">
    <h2>{{ isEdit ? 'Edit Point' : 'Add Point' }}</h2>
    
    <div class="field-group">
      <label>Name</label>
      <input type="text" [(ngModel)]="point.name" placeholder="e.g. Gas Station" />
    </div>
    
    <div class="field-group">
      <label>Type <small>(select one or more)</small></label>
      <div class="type-selector">
        <button
          type="button"
          class="type-btn type-none"
          [class.active]="!point.types?.length"
          (click)="clearTypes()">
          <span>None</span>
        </button>
        @for (t of pointTypes; track t) {
          <button
            type="button"
            class="type-btn"
            [ngClass]="'type-' + t.toLowerCase()"
            [class.active]="point.types?.includes(t)"
            [attr.aria-pressed]="point.types?.includes(t) ?? false"
            (click)="toggleType(t)">
            @switch (t) {
              @case ('Food') {
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/>
                  <path d="M7 2v20"/>
                  <path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>
                </svg>
              }
              @case ('Gas') {
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="3" y1="22" x2="15" y2="22"/>
                  <line x1="4" y1="9" x2="14" y2="9"/>
                  <path d="M14 22V4a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v18"/>
                  <path d="M14 13h2a2 2 0 0 1 2 2v2a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2V9.83a2 2 0 0 0-.59-1.42L18 5"/>
                </svg>
              }
              @case ('Limit') {
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"/>
                  <path d="M7.5 15.5a6.5 6.5 0 1 1 9 0"/>
                  <path d="M12 12l3.5-3.5"/>
                  <circle cx="12" cy="12" r="1.5" fill="currentColor"/>
                </svg>
              }
              @case ('MOP') {
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 3 5 12h4l-3 6h12l-3-6h4L12 3z"/>
                  <line x1="12" y1="18" x2="12" y2="22"/>
                  <line x1="8" y1="22" x2="16" y2="22"/>
                </svg>
              }
              @case ('Gates') {
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="2" y="10" width="4" height="11" rx="1"/>
                  <path d="M6 12h15a1 1 0 0 0 1-1V9a1 1 0 0 0-1-1H6v4z"/>
                  <line x1="10" y1="8" x2="8" y2="12"/>
                  <line x1="15" y1="8" x2="13" y2="12"/>
                  <line x1="20" y1="8" x2="18" y2="12"/>
                  <line x1="1" y1="21" x2="7" y2="21"/>
                </svg>
              }
            }
            <span>{{ t }}</span>
          </button>
        }
      </div>
    </div>

    <div class="field-group">
      <label>Odometer</label>
      <input type="number" [(ngModel)]="point.odometer" (ngModelChange)="onOdometerChange($event)" placeholder="e.g. 10450" />
    </div>
    
    <div class="field-group">
      <label>Distance (from previous)</label>
      <input type="number" [(ngModel)]="point.distance" placeholder="e.g. 12.5" />
    </div>
    
    <div class="field-group">
      <label>Comment</label>
      <input type="text" [(ngModel)]="point.comment" placeholder="e.g. Stop for coffee" />
    </div>
    
    <div class="form-actions">
      <button class="btn-save" (click)="onSave()">Save</button>
      <button class="btn-cancel" (click)="onCancel()">Cancel</button>
    </div>
  </div>
}
