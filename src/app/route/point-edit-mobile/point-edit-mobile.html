@if (point) {
  <div class="point-editor">
    <h2>{{ isEdit ? 'Edit Point' : 'Add Point' }}</h2>
    <div class="field-group">
      <label>Name</label>
      <input type="text" [(ngModel)]="point.name" placeholder="Point Name" />
    </div>
    <div class="field-group">
      <label>Odometer</label>
      <input type="number" [(ngModel)]="point.odometer" (ngModelChange)="onOdometerChange($event)" placeholder="Odometer" />
    </div>
    <div class="field-group">
      <label>Distance</label>
      <input type="number" [(ngModel)]="point.distance" placeholder="Distance" />
    </div>
        <div class="field-group">
      <label>Comment</label>
      <input type="text" [(ngModel)]="point.comment" placeholder="Comment" />
    </div>
    <button (click)="onSave()">Save</button>
    <button (click)="onCancel()">Cancel</button>
  </div>
}
