<div class="login-container">
  <div class="login-card">
    <h2>Sign In</h2>
    
    @if (errorMessage()) {
      <div class="error-message">
        {{ errorMessage() }}
      </div>
    }
    
    <p class="login-prompt">Please sign in with your Google account to access your waypoints and routes.</p>
    
    <button class="btn-google" (click)="signInWithGoogle()" [disabled]="loading()">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 48 48" style="vertical-align: middle; margin-right: 8px;">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.5 24c0-1.63-.15-3.2-.43-4.73H24v9h12.75c-.55 2.91-2.19 5.38-4.65 7.04l7.24 5.61C43.58 36.6 46.5 30.87 46.5 24z"/>
        <path fill="#FBBC05" d="M10.54 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.98-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.24-5.61c-2.01 1.35-4.59 2.17-8.65 2.17-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      {{ loading() ? 'Signing in...' : 'Sign in with Google' }}
    </button>
  </div>
</div>
