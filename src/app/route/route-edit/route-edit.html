<div class="route-editor">
  <h2>{{ id ? 'Edit Route' : 'Create Route' }}</h2>
  
  @if (routeInput.id) {
    <div class="route-id-badge">ID: {{ routeInput.id }}</div>
  }
  
  <div class="field-group">
    <label>Route Name</label>
    <input type="text" placeholder="e.g. Summer Vacation" [(ngModel)]="routeInput.name" (ngModelChange)="onRouteNameChange($event)" />
  </div>
  
  <div class="field-group">
    <label>Direction</label>
    <input type="text" placeholder="e.g. Northbound" [(ngModel)]="routeInput.direction" (ngModelChange)="onRouteDirectionChange($event)" />
  </div>
  
  <div class="form-actions">
    <button class="btn-save" (click)="onSave()">Save</button>
    <button class="btn-cancel" (click)="onCancel()">Cancel</button>
  </div>
</div>
