<div class="route-editor">
  <h2>{{ id ? 'Edit Route' : 'Create Route' }}</h2>
  
  @if (generatedId) {
    <div class="route-id-badge">ID: {{ generatedId }}</div>
  }
  
  <div class="field-group">
    <label>Source</label>
    <input type="text" placeholder="e.g. Home" [(ngModel)]="routeInput.source" />
  </div>

  <div class="field-group">
    <label>Route</label>
    <input type="text" placeholder="e.g. A1" [(ngModel)]="routeInput.route" />
  </div>
  
  <div class="field-group">
    <label>Destination</label>
    <input type="text" placeholder="e.g. Work" [(ngModel)]="routeInput.destination" />
  </div>
  
  <div class="form-actions">
    <button class="btn-save" (click)="onSave()">Save</button>
    <button class="btn-cancel" (click)="onCancel()">Cancel</button>
  </div>
</div>
